<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-blue-400">
    <div id="game" class="w-100 border-2 rounded-xl p-6 bg-gray-400">
        <h1 class="text-4xl text-red-900 text-center mb-2">Memory Game</h1>
        <div class="flex justify-between text-lg ">
            <p class="text-2xl mb-2">Moves</p>
            <p id="moves">0</p>
            <p class="text-2xl mb-2">Time</p>
            <p id="time">0s</p>
        </div>

        <p class="text-2xl mb-2">Best Time</p>
        <p class="text-2xl mb-2"></p>

        <div id="cards" class="grid grid-cols-4 gap-2"></div>
        <div>
            <h1 class="text-2xl mt-2">Game Statistics</h1>
            <p>Total games:</p>
            <p id="total-games"></p>
            <p>Total Wins:</p>
            <p id="total-wins"></p>
            <p>Best Time:</p>
            <p id="best-time"></p>
            <p>Lowest Moves:</p>
            <p id="lowest-moves"></p>
        </div>

        <button id="reset"
            class="flex justify-center mx-auto text-white rounded-lg border-2 border-black mt-4">Reset</button>

    </div>
    <script src="memoryCards.js"></script>

</body>

</html>
